services:
  # 1. MASCoT FastAPI Backend API Service
  - type: web
    name: mascot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mascot-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

  # 2. MASCoT MCP Server Service (Streamable HTTP Transport)
  - type: web
    name: mascot-mcp
    runtime: python
    rootDir: mcp_server
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: mascot-api
          property: host

databases:
  # 3. Persistent PostgreSQL Database
  - name: mascot-db
    plan: free
    databaseName: mascot
    user: mascot_user
